[project]
name = "ocelescope-module-interactive-dfg"
version = "0.1.0"
readme = "README.md"
description = "Interactive object-centric directly-follows graph for Ocelescope"
authors = [{ name = "Nina Graves" }]
requires-python = ">=3.11"
dependencies = [
  "ocelescope-backend>=0.13.0",
  "networkx>=3",
]

[project.entry-points."ocelescope_backend.modules"]
interactiveDfg = "ocelescope_module_interactive_dfg.module:InteractiveDfg"

[build-system]
requires = ["uv_build>=0.9.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true
